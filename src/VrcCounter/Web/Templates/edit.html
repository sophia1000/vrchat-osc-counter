<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Edit {{name}}</title><style>:root{color-scheme:dark}body{background:#0e1013;color:#e7e9ee;font:15px system-ui;margin:0}.card{max-width:700px;margin:30px auto;background:#151922;border:1px solid #283043;border-radius:14px;padding:22px}form{display:grid;gap:12px}label{display:grid;gap:5px}input,select{padding:9px;background:#10141c;color:white;border:1px solid #39445c;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn,button{padding:9px 13px;background:#2d6cdf;color:#fff;border:0;border-radius:9px;text-decoration:none}.danger{background:#b72c35}</style></head><body><main class="card"><h1>Edit {{name}}</h1><form method="post"><input type="hidden" name="original_name" value="{{name}}"><label>Name<input required name="name" value="{{name}}"></label><label>OSC address<input required name="address" value="{{address}}"></label><div class="row"><label>Count<input type="number" name="count" value="{{count}}"></label><label>Trigger mode<select name="trigger_mode"><option value="threshold" {{threshold_mode}}>Threshold / hysteresis</option><option value="int_eq" {{int_mode}}>Integer equals</option></select></label></div><div class="row"><label>Threshold<input type="number" step="any" name="threshold" value="{{threshold}}"></label><label>Release threshold<input type="number" step="any" name="release_threshold" value="{{release}}"></label></div><div class="row"><label>Integer value<input type="number" name="int_value" value="{{int_value}}"></label><label>Debounce ms<input type="number" name="debounce_ms" value="{{debounce}}"></label></div><label>Chatbox<select name="send_chatbox"><option value="true" {{chat_on}}>Enabled</option><option value="false" {{chat_off}}>Disabled</option></select></label><label>Chatbox notification<select name="chatbox_notify"><option value="true" {{notify_on}}>Enabled</option><option value="false" {{notify_off}}>Disabled</option></select></label><label>Chatbox template<input name="chatbox_template" value="{{template}}"></label><div><button>Save</button> <a class="btn" href="/">Cancel</a> <a class="btn danger" href="/delete/{{encoded_name}}" onclick="return confirm('Delete this counter?')">Delete</a></div></form></main></body></html>
