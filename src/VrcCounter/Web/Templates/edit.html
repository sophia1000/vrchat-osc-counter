<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit {{name}}</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0e1013;color:#e7e9ee;font:15px system-ui;margin:0}.card{max-width:760px;margin:30px auto;background:#151922;border:1px solid #283043;border-radius:14px;padding:22px}form{display:grid;gap:14px}label{display:grid;gap:5px}input,select{width:100%;padding:9px;background:#10141c;color:white;border:1px solid #39445c;border-radius:8px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn,button{padding:9px 13px;background:#2d6cdf;color:#fff;border:1px solid transparent;border-radius:9px;text-decoration:none;cursor:pointer;font:inherit}.danger{background:#b72c35}.picker{border:1px solid #34415b;background:#10151f;border-radius:12px;padding:15px}.picker header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.picker h2{font-size:16px;margin:0}.ghost{background:#202a3b;border-color:#384660}.muted{color:#9aa9c1;font-size:12px;line-height:1.5}.parameter-list{max-height:280px;overflow:auto;display:grid;gap:4px;margin-top:10px}.parameter{width:100%;text-align:left;background:#192232;border-color:#2b3850;display:flex;justify-content:space-between;gap:12px;align-items:center}.parameter:hover,.parameter:focus-visible{background:#243d61;border-color:#5794f2}.parameter.selected{border-color:#64d9ae;background:#19382f}.parameter:disabled{opacity:.55;cursor:not-allowed}.parameter strong{display:block;overflow-wrap:anywhere}.parameter small{display:block;color:#a8b9d2;font-size:11px;overflow-wrap:anywhere}.parameter .value{white-space:nowrap;color:#80dfbd;font-size:12px}.picker p{margin:9px 0}button:disabled{cursor:wait;opacity:.6}.feedback{color:#80dfbd;min-height:18px;margin:0;font-size:12px}@media(max-width:600px){.card{margin:12px;padding:16px}.row{grid-template-columns:1fr}}
</style></head><body><main class="card"><h1>Edit {{name}}</h1>
<form method="post">
<input type="hidden" name="original_name" value="{{name}}">
<label>Name<input required name="name" value="{{name}}"></label>
<section class="picker" aria-label="Avatar parameter browser">
<header><h2>Find an avatar parameter</h2><button id="refreshParameters" class="ghost" type="button">Refresh</button></header>
<label>Search current avatar<input id="parameterSearch" type="search" placeholder="Search names or OSC addresses..." autocomplete="off"></label>
<p id="parameterStatus" class="muted" role="status">Looking for VRChat...</p>
<div id="parameterList" class="parameter-list" aria-label="Available parameters"></div>
<p id="parameterFeedback" class="feedback" role="status"></p>
<p class="muted">Shows parameters exposed by VRChat over OSC, including built-in parameters. Non-numeric or input-only parameters cannot drive a counter. Manual entry is always available below.</p>
</section>
<label>OSC address<input required name="address" value="{{address}}"></label>
<div class="row"><label>Count<input type="number" name="count" value="{{count}}"></label><label>Trigger mode<select name="trigger_mode"><option value="threshold" {{threshold_mode}}>Threshold / hysteresis</option><option value="int_eq" {{int_mode}}>Integer equals</option></select></label></div>
<div class="row"><label>Threshold<input type="number" step="any" name="threshold" value="{{threshold}}"></label><label>Release threshold<input type="number" step="any" name="release_threshold" value="{{release}}"></label></div>
<div class="row"><label>Integer value<input type="number" name="int_value" value="{{int_value}}"></label><label>Debounce ms<input type="number" name="debounce_ms" value="{{debounce}}"></label></div>
<label>Chatbox<select name="send_chatbox"><option value="true" {{chat_on}}>Enabled</option><option value="false" {{chat_off}}>Disabled</option></select></label>
<label>Chatbox notification<select name="chatbox_notify"><option value="true" {{notify_on}}>Enabled</option><option value="false" {{notify_off}}>Disabled</option></select></label>
<label>Chatbox template<input name="chatbox_template" value="{{template}}"></label>
<div><button>Save</button> <a class="btn" href="/">Cancel</a> <a class="btn danger" href="/delete/{{encoded_name}}" onclick="return confirm('Delete this counter?')">Delete</a></div>
</form></main>
<script>
(()=>{
const search=document.getElementById('parameterSearch'),list=document.getElementById('parameterList'),status=document.getElementById('parameterStatus'),refresh=document.getElementById('refreshParameters'),feedback=document.getElementById('parameterFeedback'),address=document.querySelector('[name="address"]'),name=document.querySelector('[name="name"]');
let data={parameters:[]},loading=false,lastSignature='',autoName=/^Counter \d+$/.test(name.value);
name.addEventListener('input',()=>{autoName=false});
function render(){const query=search.value.trim().toLowerCase(),matches=data.parameters.filter(p=>(p.name+' '+p.address+' '+p.type).toLowerCase().includes(query));
status.textContent=(data.message||'Looking for VRChat...')+(data.avatarId?' Avatar: '+data.avatarId:'')+(query&&data.parameters.length?' ('+matches.length+' matches)':'');
const signature=JSON.stringify([matches,address.value]);if(signature===lastSignature)return;lastSignature=signature;
// Preserve list scroll and keyboard focus while refreshing live values.
const scroll=list.scrollTop,focused=document.activeElement?.dataset?.address;const fragment=document.createDocumentFragment();
for(const p of matches){const button=document.createElement('button');button.type='button';button.className='parameter'+(p.address===address.value?' selected':'');button.dataset.address=p.address;button.disabled=!p.canCount;button.title=p.canCount?'Use '+p.address:'VRChat does not expose this as a numeric output';
const details=document.createElement('span'),title=document.createElement('strong'),path=document.createElement('small'),value=document.createElement('span');title.textContent=p.name;path.textContent=p.address;details.append(title,path);value.className='value';value.textContent=p.type+(p.value!==''?' · '+p.value:'');button.append(details,value);button.onclick=()=>{address.value=p.address;if(autoName)name.value=p.name;feedback.textContent='Selected '+p.name+'. Save to start counting this parameter.';render()};fragment.append(button)}
if(!matches.length&&data.parameters.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No matching parameters. Try part of the name or enter an address manually.';fragment.append(empty)}
list.replaceChildren(fragment);list.scrollTop=scroll;if(focused)Array.from(list.children).find(b=>b.dataset.address===focused)?.focus({preventScroll:true})}
async function load(force=false){if(loading||document.hidden)return;loading=true;refresh.disabled=true;try{const r=await fetch('/api/avatar-parameters'+(force?'?refresh=true':''));if(!r.ok)throw Error('Could not read parameters. Try Refresh.');data=await r.json();render()}catch(e){data={parameters:[],message:e.message};render()}finally{loading=false;refresh.disabled=false}}
search.addEventListener('input',render);search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();list.querySelector('button:not(:disabled)')?.click()}});address.addEventListener('input',render);refresh.onclick=()=>load(true);load();setInterval(()=>load(),4000);
})();
</script></body></html>
