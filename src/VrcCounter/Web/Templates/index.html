<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VRChat Counter</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1013;color:#e7e9ee;font:15px system-ui,Segoe UI,sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.muted,.rangeInfo{color:#98a4bb}.rangeInfo{font-size:12px;margin:8px 0 0}.rangeInfo.warn{color:#f6c85f}.card,.graph,.tile{background:#151922;border:1px solid #283043;border-radius:14px;padding:16px;margin:14px 0}.btn,button{display:inline-block;border:0;border-radius:9px;background:#2d6cdf;color:white;padding:8px 12px;text-decoration:none;cursor:pointer}.sm{padding:5px 9px;font-size:13px}.danger{background:#b72c35;margin-left:6px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #283043;text-align:left}.drag{cursor:grab}.pill,code{background:#10141c;border-radius:7px;padding:3px 7px}.counter-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.tile{margin:0}.tile>div,.tile footer,.graph header{display:flex;justify-content:space-between;align-items:center;gap:10px}.tile strong{font-size:24px}.graphs{display:grid;grid-template-columns:repeat({{columns}},minmax(0,1fr));gap:14px}.graph{margin:0}.chartwrap{position:relative;min-height:120px}input,select{padding:7px;border:1px solid #39445c;border-radius:7px;background:#10141c;color:#e7e9ee}details form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:flex;flex-direction:column;gap:4px}@media(max-width:800px){.graphs{grid-template-columns:1fr}table{font-size:12px}.wrap{padding:12px}}
</style></head><body><main class="wrap"><h1>VRChat Multi-Parameter Counter</h1><p class="muted">OSC In: <code>{{osc_in_ip}}:{{osc_in_port}}</code> · OSC Out: <code>{{osc_out_ip}}:{{osc_out_port}}</code> · <span id="oscQueryStatus">OSCQuery starting…</span></p>
<section class="card"><a class="btn" href="/add">Add Counter</a> <a class="btn" href="/add-graph">Add Graph</a>
<div id="counterTable" style="display:{{table_display}}"><table><thead><tr><th></th><th>Name</th><th>OSC address</th><th>Count</th><th>Chatbox</th><th></th></tr></thead><tbody>{{rows}}</tbody></table></div><div id="counterGrid" class="counter-grid" style="display:{{grid_display}}">{{tiles}}</div></section>
<section id="graphs" class="graphs">{{graphs}}</section>
<details class="card"><summary>Global settings</summary><form method="post" action="/update-global">
<label>OSC input IP<input name="osc_in_ip" value="{{osc_in_ip}}"></label><label>OSC input port<input name="osc_in_port" type="number" value="{{osc_in_port}}"></label><label>OSC output IP<input name="osc_out_ip" value="{{osc_out_ip}}"></label><label>OSC output port<input name="osc_out_port" type="number" value="{{osc_out_port}}"></label>
<label>Web bind<input name="web_ui_bind" value="{{web_ui_bind}}"></label><label>Web port<input name="web_ui_port" type="number" value="{{web_ui_port}}"></label><label>Save throttle ms<input name="save_throttle_ms" type="number" value="{{save_throttle_ms}}"></label>
<label>Chatbox mode<select name="chatbox_mode"><option {{modern}}>modern</option><option {{legacy2}}>legacy2</option><option {{both}}>both</option></select></label><label>Messages/minute<input name="chatbox_per_minute_limit" type="number" value="{{per_minute}}"></label><label>Minimum interval ms<input name="chatbox_min_interval_ms" type="number" value="{{min_interval}}"></label><label>Auto-clear ms<input name="chatbox_auto_clear_ms" type="number" value="{{auto_clear}}"></label>
<label>New counters use chatbox<select name="chatbox_enabled_by_default"><option value="true" {{default_chat_on}}>Yes</option><option value="false" {{default_chat_off}}>No</option></select></label><label>New counters notify<select name="chatbox_notify_by_default"><option value="true" {{default_notify_on}}>Yes</option><option value="false" {{default_notify_off}}>No</option></select></label><label>Compact counters<select name="counters_compact"><option value="true" {{compact_on}}>Yes</option><option value="false" {{compact_off}}>No</option></select></label><label>Graph columns<select name="home_graphs_columns"><option {{col1}}>1</option><option {{col2}}>2</option><option {{col3}}>3</option></select></label><div><button>Save settings</button></div></form></details></main>
<script>
const charts={};const colors=['#64a3ff','#ff7697','#58d6a8','#f6c85f','#b092ff','#ff9564'];
async function drawGraphs(){for(const el of document.querySelectorAll('.graph')){const gid=el.dataset.gid,p=await fetch('/api/graph-prefs?gid='+encodeURIComponent(gid)).then(r=>r.json());let end=Date.now(),span={"10m":6e5,"30m":18e5,"1h":36e5,"2h":72e5,"5h":18e6,"12h":432e5,"1d":864e5,"7d":6048e5,"30d":2592e6}[p.preset]||36e5,start=end-span;if(p.preset==='custom'){start=p.custom_start_ms||start;end=p.custom_end_ms||end}const q=new URLSearchParams({start_ms:start,end_ms:end,bucket:p.bucket,mode:p.mode});if(p.preset==='all')q.set('all','true');(p.counters||[]).forEach(n=>q.append('counter',n));const d=await fetch('/api/series_multi?'+q).then(r=>r.json());const visibleEvents=d.series.reduce((n,s)=>n+s.eventCount,0);let info=el.querySelector('.rangeInfo');if(!info){info=document.createElement('p');info.className='rangeInfo';el.querySelector('header').after(info)}if(visibleEvents){info.textContent=`${visibleEvents.toLocaleString()} events · ${new Date(d.rangeStartMs).toLocaleString()} – ${new Date(d.rangeEndMs).toLocaleString()}`;info.classList.remove('warn')}else{info.textContent='No events in this time range — edit the graph and choose All recorded history.';info.classList.add('warn')}const sets=d.series.map((s,i)=>({label:s.name,data:s.eventCount?s.points.map(x=>({x:x.t,y:x.v})):[],borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'44',borderWidth:2,pointRadius:s.points.length<200?2:0,fill:p.graphtype==='area',stepped:p.graphtype==='step'}));charts[gid]?.destroy();charts[gid]=new Chart(el.querySelector('canvas'),{type:p.graphtype==='bar'?'bar':'line',data:{datasets:sets},options:{animation:false,responsive:true,maintainAspectRatio:false,parsing:false,interaction:{mode:'nearest',intersect:false},plugins:{tooltip:{callbacks:{title:items=>items.length?new Date(items[0].parsed.x).toLocaleString():''}}},scales:{x:{type:'linear',ticks:{maxTicksLimit:6,callback:v=>new Date(v).toLocaleString()}},y:{beginAtZero:p.mode==='delta',min:p.autoY?undefined:p.ymin,max:p.autoY?undefined:p.ymax}}}})}}
fetch('/api/oscquery/status').then(r=>r.json()).then(s=>{document.getElementById('oscQueryStatus').textContent=s.running?`OSCQuery active (TCP ${s.tcpPort})`:'OSCQuery unavailable'}).catch(()=>{});
function updateState(s){for(const c of s.counters)for(const el of document.querySelectorAll(`[data-name="${CSS.escape(c.name)}"]`)){const n=el.matches('td')?el:el.querySelector('.count');if(n)n.textContent=Number(c.count).toLocaleString()}}
document.addEventListener('change',e=>{if(e.target.classList.contains('chatToggle')){const box=e.target.closest('[data-name]');fetch('/toggle-chatbox',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({name:box.dataset.name,on:e.target.checked?'1':'0'})})}});
let dragged;document.addEventListener('dragstart',e=>{const r=e.target.closest('[draggable="true"][data-name]');if(r)dragged=r});document.addEventListener('dragover',e=>{const r=e.target.closest('[draggable="true"][data-name]');if(r&&dragged&&r.parentNode===dragged.parentNode){e.preventDefault();r.parentNode.insertBefore(dragged,r)}});document.addEventListener('drop',e=>{if(dragged){const selector=dragged.matches('tr')?'tbody tr[data-name]':'#counterGrid .tile[data-name]';fetch('/api/counter-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:[...document.querySelectorAll(selector)].map(x=>x.dataset.name)})});dragged=null}});
try{const es=new EventSource('/events');es.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='count'){updateState({counters:[x]});drawGraphs()}else location.reload()};es.onerror=()=>{es.close();setInterval(()=>fetch('/api/state').then(r=>r.json()).then(updateState),1000)}}catch{setInterval(()=>fetch('/api/state').then(r=>r.json()).then(updateState),1000)}drawGraphs();
</script></body></html>
