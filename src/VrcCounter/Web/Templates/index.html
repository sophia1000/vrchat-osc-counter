<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRChat Counter</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#131722;--panel2:#181d29;--line:#293246;--text:#edf1f8;--muted:#94a0b6;--blue:#5794f2;--green:#56d39b;--red:#e4525d;--amber:#f2c96d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -30%,#18223a 0,var(--bg) 42%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.topbar,.section-head,.graph header,.tile-head,.tile footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar{margin-bottom:18px}.topbar h1{font-size:22px;margin:0}.status{color:var(--muted);font-size:12px}.status code,.pill,code{background:#0d111a;border:1px solid #232b3c;border-radius:6px;padding:3px 7px}.card,.graph,.tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 10px 30px #0003}.card{border-radius:12px;padding:16px;margin:14px 0}.section-head h2{font-size:16px;margin:0}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn,button{appearance:none;border:1px solid transparent;border-radius:7px;background:#2d6ecf;color:#fff;padding:7px 11px;text-decoration:none;cursor:pointer;font:inherit;transition:background .16s,transform .16s,border-color .16s}.btn:hover,button:hover{background:#397de2}.btn:active,button:active{transform:translateY(1px)}.btn.ghost,button.ghost{background:#191f2c;border-color:#344057}.btn.ghost:hover,button.ghost:hover{background:#232b3c}.sm{padding:5px 8px;font-size:12px}.danger{background:#812b35;border-color:#a6414b}.muted,.rangeInfo{color:var(--muted)}.counter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:13px}.tile{border-radius:10px;padding:13px;min-height:100px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,opacity .2s}.tile strong{font-size:25px;font-variant-numeric:tabular-nums}.tile footer{margin-top:18px}.chatToggle{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;background:#171c27;border-color:#313a4e;color:#aeb8c9;font-size:11px}.chatToggle span{position:relative;width:27px;height:15px;border-radius:10px;background:#3a4355;transition:background .18s}.chatToggle span::after{content:"";position:absolute;width:11px;height:11px;left:2px;top:2px;border-radius:50%;background:#aeb8c9;transition:transform .18s,background .18s}.chatToggle.on{color:#fff;border-color:#367d65;background:#183129}.chatToggle.on span{background:#318663}.chatToggle.on span::after{transform:translateX(12px);background:#fff}.drag{cursor:grab;color:#78869f;user-select:none}.drag:active{cursor:grabbing}.dragging{opacity:.45;box-shadow:0 18px 44px #0009;transform:scale(.985)}.drop-target{border-color:var(--blue)!important;box-shadow:0 0 0 1px var(--blue),0 8px 25px #0005!important}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #252d3e;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}tr[data-name]{transition:transform .2s ease,opacity .2s}.graphs{display:grid;grid-template-columns:repeat({{columns}},minmax(0,1fr));gap:14px;align-items:start}.graph{position:relative;border-radius:12px;padding:13px;min-width:0;overflow:hidden;resize:vertical}.graph header b{font-size:14px}.graph-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.series-toggles{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 5px}.series-toggle{background:#171c27;border:1px solid #313a4e;color:#aeb8c9;padding:3px 8px;font-size:11px}.series-toggle.on{color:#fff;border-color:var(--series);box-shadow:inset 3px 0 var(--series)}.rangeInfo{font-size:11px;margin:6px 0}.rangeInfo.warn{color:var(--amber)}.chartwrap{position:relative;min-height:130px}.live-badge{background:transparent;border-color:#2d5d4b;color:var(--green);font-size:11px;padding:4px 8px}.live-badge:hover{background:#183129;border-color:#367d65}.live-badge.paused{color:var(--amber);border-color:#68572f}.live-badge.paused:hover{background:#332b19}.empty{display:none;position:absolute;inset:45% 10px auto;text-align:center;color:var(--muted)}.graph.no-data .empty{display:block}input,select{padding:7px;border:1px solid #39445c;border-radius:7px;background:#0e131d;color:var(--text)}details summary{cursor:pointer;font-weight:600}details form{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px;margin-top:16px}label{display:flex;flex-direction:column;gap:5px}.checkline{display:flex;flex-direction:row;align-items:center}.tip{font-size:11px;color:var(--muted);margin:8px 0 0}.toast{position:fixed;right:20px;bottom:20px;background:#20283a;border:1px solid #3b4862;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.graphs{grid-template-columns:1fr}.wrap{padding:12px}.topbar{align-items:flex-start;flex-direction:column}table{font-size:12px}.graph{resize:vertical}}
.tile>div{display:flex;align-items:center;justify-content:space-between;gap:12px}.graphs{align-items:stretch}.graph{display:flex;flex-direction:column;resize:none}.row-resize-handle{display:flex;width:100%;height:15px;margin:8px 0 -8px;padding:0;align-items:center;justify-content:center;background:transparent;border:0;cursor:ns-resize;touch-action:none}.row-resize-handle::before{content:"";width:54px;height:3px;border-radius:3px;background:#536079;transition:width .15s,background .15s}.row-resize-handle:hover::before,.row-resize-handle:focus-visible::before{width:76px;background:var(--blue)}body.resizing-row{cursor:ns-resize;user-select:none}
</style></head><body><main class="wrap">
<div class="topbar"><div><h1>VRChat Counter</h1><div class="status">OSC Out <code>{{osc_out_ip}}:{{osc_out_port}}</code> · <span id="oscQueryStatus">Checking OSC input...</span> · <span id="chatboxStatus">Chatbox: waiting for a send</span></div></div><div class="actions"><button id="reconnectOsc" class="ghost" type="button">Reconnect OSC</button><a class="btn" href="/add">+ Counter</a><a class="btn" href="/add-graph">+ Graph</a></div></div>
<section class="card"><div class="section-head"><div><h2>Counters</h2><p class="tip">Drag to reorder · double-click a counter to toggle its chatbox output</p></div></div>
<div id="counterTable" style="display:{{table_display}}"><table><thead><tr><th></th><th>Name</th><th>OSC address</th><th>Count</th><th>Chatbox</th><th></th></tr></thead><tbody>{{rows}}</tbody></table></div><div id="counterGrid" class="counter-grid" style="display:{{grid_display}}">{{tiles}}</div></section>
<section><div class="section-head"><h2>Dashboards</h2></div><div id="graphs" class="graphs">{{graphs}}</div></section>
<details class="card"><summary>Global settings</summary><form method="post" action="/update-global">
<label>OSC input method<select name="osc_transport"><option value="oscquery" {{oscquery_transport}}>OSCQuery (recommended)</option><option value="legacy" {{legacy_osc_transport}}>Legacy OSC</option></select></label>
<label>OSC input IP<input name="osc_in_ip" value="{{osc_in_ip}}"></label><label>Legacy OSC input port<input name="osc_in_port" type="number" value="{{osc_in_port}}"><span class="tip">OSCQuery chooses a free port automatically.</span></label><label>OSC output IP<input name="osc_out_ip" value="{{osc_out_ip}}"></label><label>OSC output port<input name="osc_out_port" type="number" value="{{osc_out_port}}"></label>
<label>Web bind<input name="web_ui_bind" value="{{web_ui_bind}}"></label><label>Web port<input name="web_ui_port" type="number" value="{{web_ui_port}}"></label><label>Save throttle ms<input name="save_throttle_ms" type="number" value="{{save_throttle_ms}}"></label>
<label>Chatbox mode<select name="chatbox_mode"><option {{modern}}>modern</option><option {{legacy2}}>legacy2</option><option {{both}}>both</option></select></label><label>Messages/minute<input name="chatbox_per_minute_limit" type="number" min="1" value="{{per_minute}}"></label><label>Minimum interval ms (VRChat floor: 1000)<input name="chatbox_min_interval_ms" type="number" min="1000" value="{{min_interval}}"></label><label>Auto-clear ms<input name="chatbox_auto_clear_ms" type="number" value="{{auto_clear}}"></label>
<label>New counters use chatbox<select name="chatbox_enabled_by_default"><option value="true" {{default_chat_on}}>Yes</option><option value="false" {{default_chat_off}}>No</option></select></label><label>New counters notify<select name="chatbox_notify_by_default"><option value="true" {{default_notify_on}}>Yes</option><option value="false" {{default_notify_off}}>No</option></select></label><label>Compact counters<select name="counters_compact"><option value="true" {{compact_on}}>Yes</option><option value="false" {{compact_off}}>No</option></select></label><label>Graph columns<select name="home_graphs_columns"><option {{col1}}>1</option><option {{col2}}>2</option><option {{col3}}>3</option></select></label><div class="actions"><button name="action" value="save">Save settings</button><button name="action" value="reconnect" class="ghost">Save + reconnect OSC</button><button id="testChatbox" class="ghost" type="button">Send test chatbox message</button></div></form></details>
</main><div id="toast" class="toast"></div>
<script>
const charts={},colors=['#5794f2','#e76686','#56d39b','#f2c96d','#a87ff2','#ff8f5b','#55c7e8','#d27bd8'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const fmt=ms=>new Date(ms).toLocaleString(),fmtTick=(ms,span)=>span<=864e5?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):span<=6048e5?new Date(ms).toLocaleString([],{weekday:'short',hour:'numeric'}):new Date(ms).toLocaleDateString([],{month:'short',day:'numeric',year:'2-digit'});
function queryFor(p,view){const q=new URLSearchParams({bucket:p.bucket||'auto',mode:p.mode||'total',preset:p.preset||'1h',follow:String(p.auto_follow!==false)});if(view){q.set('start_ms',Math.round(view.start));q.set('end_ms',Math.round(view.end))}else q.set('reset','true');(p.counters||[]).forEach(n=>q.append('counter',n));return q}
async function graphData(gid,p,view){const q=queryFor(p,view);try{const r=await fetch('/api/graph-data?gid='+encodeURIComponent(gid)+'&'+q);if(r.ok)return await r.json()}catch{}const d=await fetch('/api/series_multi?'+q).then(r=>r.json());return{...d,dataBounds:{startMs:d.availableStartMs,endMs:d.availableEndMs,eventCount:d.eventCount},viewport:{startMs:d.rangeStartMs,endMs:d.rangeEndMs},serverNowMs:Date.now(),hasData:d.series?.some(s=>s.eventCount)}}
function savedHidden(gid){try{return new Set(JSON.parse(localStorage.getItem('vrc.graph.hidden.'+gid)||'[]'))}catch{return new Set()}}
function storeHidden(gid,set){localStorage.setItem('vrc.graph.hidden.'+gid,JSON.stringify([...set]))}
async function renderGraph(el,view,refreshPrefs=false){if(!el)return;const token=el._drawToken=(el._drawToken||0)+1,gid=el.dataset.gid,p=!refreshPrefs&&el._prefs?el._prefs:await fetch('/api/graph-prefs?gid='+encodeURIComponent(gid)).then(r=>r.json()),d=await graphData(gid,p,view??null);if(token!==el._drawToken)return;const bounds=d.dataBounds||{startMs:d.availableStartMs,endMs:d.availableEndMs},vp=d.viewport||{startMs:d.rangeStartMs,endMs:d.rangeEndMs},hidden=savedHidden(gid),sets=(d.series||[]).map((s,i)=>({label:s.name,data:(s.points||[]).map(x=>({x:x.t,y:x.v})),borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'38',borderWidth:2,pointRadius:s.points?.length<180?2:0,pointHoverRadius:4,fill:p.graphtype==='area',stepped:p.graphtype==='step',hidden:hidden.has(s.name)}));
 el.classList.toggle('no-data',!d.hasData&&!sets.some(s=>s.data.length));const info=el.querySelector('.rangeInfo'),visibleEvents=(d.series||[]).reduce((n,s)=>n+Number(s.eventCount||0),0);info.textContent=d.hasData===false?'No recorded events for the selected counters.':`${visibleEvents.toLocaleString()} events in view · ${fmt(vp.startMs)} to ${fmt(vp.endMs)}`;const toggles=el.querySelector('.series-toggles');toggles.innerHTML=sets.map((s,i)=>`<button type="button" class="series-toggle ${s.hidden?'':'on'}" data-index="${i}" style="--series:${s.borderColor}">${escapeHtml(s.label)}</button>`).join('');
 const type=p.graphtype==='bar'?'bar':'line',options={animation:{duration:180},responsive:true,maintainAspectRatio:false,parsing:false,normalized:true,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:a=>a.length?fmt(a[0].parsed.x):''}}},scales:{x:{type:'linear',min:vp.startMs,max:vp.endMs,ticks:{maxTicksLimit:7,callback:v=>fmtTick(v,vp.endMs-vp.startMs)},grid:{color:'#242b3a'}},y:{beginAtZero:p.mode==='delta',min:p.autoY?undefined:p.ymin,max:p.autoY?undefined:p.ymax,grid:{color:'#242b3a'}}}};let current=charts[gid];if(current?.config.type===type){current.data.datasets=sets;current.options=options;current.update('none')}else{current?.destroy();current=charts[gid]=new Chart(el.querySelector('canvas'),{type,data:{datasets:sets},options})}
 toggles.onclick=e=>{const b=e.target.closest('.series-toggle');if(!b)return;const ds=charts[gid].data.datasets[+b.dataset.index];ds.hidden=!ds.hidden;b.classList.toggle('on',!ds.hidden);ds.hidden?hidden.add(ds.label):hidden.delete(ds.label);storeHidden(gid,hidden);charts[gid].update('none')};el._prefs=p;el._bounds=bounds;el._view=vp;if(el._follow===undefined)el._follow=p.auto_follow!==false;updateLive(el);clearTimeout(el._refreshTimer);if(p.auto_refresh)el._refreshTimer=setTimeout(()=>renderGraph(el,el._follow?undefined:{start:el._view.startMs,end:el._view.endMs}),Math.max(1000,p.auto_refresh_ms||60000))}
function updateLive(el){const b=el.querySelector('.live-badge');b.textContent=el._follow?'● Live':'○ Not live';b.title=el._follow?'Live view is current':'Click to jump to live view';b.classList.toggle('paused',!el._follow)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function setRowHeight(row,height){const h=Math.max(130,Math.min(1200,Math.round(height)));for(const panel of document.querySelectorAll(`.graph[data-row="${CSS.escape(String(row))}"]`)){panel.querySelector('.chartwrap').style.height=h+'px';charts[panel.dataset.gid]?.resize()}return h}
function beginRowResize(e,el){if(e.button!==0)return;e.preventDefault();const row=el.dataset.row,startY=e.clientY,startHeight=el.querySelector('.chartwrap').getBoundingClientRect().height;document.body.classList.add('resizing-row');const move=ev=>setRowHeight(row,startHeight+ev.clientY-startY);const end=async ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);document.body.classList.remove('resizing-row');const height=setRowHeight(row,startHeight+ev.clientY-startY);await fetch('/api/home-graph-row-height',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({row:Number(row),height})})};document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)}
async function initGraphs(){for(const el of document.querySelectorAll('.graph')){el.querySelector('header span').classList.add('graph-tools');el.querySelector('header span').insertAdjacentHTML('afterbegin','<button type="button" class="live-badge">● Live</button>');el.querySelector('header').insertAdjacentHTML('afterend','<div class="series-toggles"></div><p class="rangeInfo">Loading history...</p>');el.querySelector('.chartwrap').insertAdjacentHTML('beforeend','<div class="empty">No data in this range</div>');el.insertAdjacentHTML('beforeend','<button type="button" class="row-resize-handle" aria-label="Resize this graph row" title="Drag to resize every graph in this row"></button>');el.querySelector('.row-resize-handle').addEventListener('pointerdown',e=>beginRowResize(e,el));el.querySelector('.live-badge').onclick=()=>{el._follow=true;renderGraph(el)};await renderGraph(el)}}
function setChatToggle(toggle,on){toggle.classList.toggle('on',!!on);toggle.setAttribute('aria-checked',String(!!on))}
function updateState(s){for(const c of s.counters||[])for(const el of document.querySelectorAll(`[data-name="${CSS.escape(c.name)}"]`)){const n=el.querySelector?.('.count')||(el.classList?.contains('count')?el:null);if(n&&c.count!==undefined)n.textContent=Number(c.count).toLocaleString();const t=el.querySelector?.('.chatToggle');if(t&&c.send_chatbox!==undefined)setChatToggle(t,c.send_chatbox)}}
async function toggleChatbox(box,on){for(const el of document.querySelectorAll(`[data-name="${CSS.escape(box.dataset.name)}"] .chatToggle`))setChatToggle(el,on);await fetch('/toggle-chatbox',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({name:box.dataset.name,on:on?'1':'0'})});toast(`${box.dataset.name} chatbox ${on?'enabled':'disabled'}`)}
document.addEventListener('click',e=>{const t=e.target.closest('.chatToggle');if(t)toggleChatbox(t.closest('[data-name]'),t.getAttribute('aria-checked')!=='true')});document.addEventListener('dblclick',e=>{const box=e.target.closest('[data-name]');if(!box||e.target.closest('a,button,input,select,label'))return;const t=box.querySelector('.chatToggle');if(t)toggleChatbox(box,t.getAttribute('aria-checked')!=='true')});
let dragged=null;function animateFlip(parent,action){const before=new Map([...parent.children].map(x=>[x,x.getBoundingClientRect()]));action();for(const x of parent.children){const a=before.get(x),b=x.getBoundingClientRect();if(!a)continue;const dx=a.left-b.left,dy=a.top-b.top;if(dx||dy)x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:190,easing:'cubic-bezier(.2,.8,.2,1)'})}}
document.addEventListener('dragstart',e=>{const x=e.target.closest('[draggable="true"][data-name]');if(!x)return;dragged=x;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',x.dataset.name);requestAnimationFrame(()=>x.classList.add('dragging'))});document.addEventListener('dragover',e=>{const x=e.target.closest('[draggable="true"][data-name]');if(!x||!dragged||x===dragged||x.parentNode!==dragged.parentNode)return;e.preventDefault();const p=x.parentNode,rect=x.getBoundingClientRect(),after=x.matches('tr')?e.clientY>rect.top+rect.height/2:e.clientX>rect.left+rect.width/2;animateFlip(p,()=>p.insertBefore(dragged,after?x.nextSibling:x));p.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));x.classList.add('drop-target')});document.addEventListener('dragend',async()=>{if(!dragged)return;const grid=dragged.closest('#counterGrid'),selector=grid?'#counterGrid .tile[data-name]':'tbody tr[data-name]';dragged.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));await fetch('/api/counter-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:[...document.querySelectorAll(selector)].map(x=>x.dataset.name)})});dragged=null});
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),1800)}
function refreshOscStatus(){return fetch('/api/oscquery/status').then(r=>r.json()).then(s=>{const el=document.getElementById('oscQueryStatus'),label=s.mode==='legacy'?'Legacy OSC':'OSCQuery',port=s.oscPort||s.legacyOscPort;if(!s.transportRunning){el.textContent=`${label} stopped${port?` on UDP ${port}`:''}: ${s.listenerError||'not listening'}`;el.style.color='var(--red)'}else if(s.mode!=='legacy'&&!s.oscQueryRunning){el.textContent=`OSC input active on UDP ${s.oscPort}, discovery unavailable: ${s.oscQueryError||'unknown error'}`;el.style.color='var(--amber)'}else{el.textContent=s.mode==='legacy'?`Legacy OSC active: UDP ${s.oscPort}`:`OSCQuery active: automatic UDP ${s.oscPort}, TCP ${s.tcpPort}`;el.style.color='var(--green)'}}).catch(()=>{})}refreshOscStatus();setInterval(refreshOscStatus,3000);document.getElementById('reconnectOsc').onclick=async()=>{const b=document.getElementById('reconnectOsc');b.disabled=true;b.textContent='Reconnecting...';const r=await fetch('/api/osc/reconnect',{method:'POST'}),result=await r.json();await refreshOscStatus();toast(result.running?`OSC reconnected on UDP ${result.oscPort}`:result.listenerError||'OSC reconnect failed');b.disabled=false;b.textContent='Reconnect OSC'};
function refreshChatboxStatus(){fetch('/api/chatbox/status').then(r=>r.json()).then(s=>{const el=document.getElementById('chatboxStatus');if(s.lastSendError){el.textContent='Chatbox send failed: '+s.lastSendError;el.style.color='var(--red)'}else if(s.lastSendMs){el.textContent=`Chatbox sent ${s.sentPacketCount.toLocaleString()} packet${s.sentPacketCount===1?'':'s'}, last ${new Date(s.lastSendMs).toLocaleTimeString()}`;el.style.color='var(--green)'}else{el.textContent=`Chatbox ready: ${s.outputIp}:${s.outputPort}`;el.style.color=''}}).catch(()=>{})}refreshChatboxStatus();setInterval(refreshChatboxStatus,3000);document.getElementById('testChatbox').onclick=async()=>{const b=document.getElementById('testChatbox');b.disabled=true;b.textContent='Sending...';const r=await fetch('/api/chatbox/test',{method:'POST'}),result=await r.json();toast(result.sent?'Test chatbox message sent':'Chatbox send failed');await refreshChatboxStatus();b.disabled=false;b.textContent='Send test chatbox message'};
try{const es=new EventSource('/events');es.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='count'){updateState({counters:[x]});for(const el of document.querySelectorAll('.graph'))if(el._prefs?.auto_refresh&&el._follow&&!el._liveDraw)el._liveDraw=setTimeout(()=>{el._liveDraw=null;renderGraph(el)},700)}else if(x.type==='counter_toggle')updateState({counters:[x]});else if(x.type==='update')fetch('/api/state').then(r=>r.json()).then(updateState);else if(x.type==='graph_prefs')renderGraph(document.querySelector(`.graph[data-gid="${CSS.escape(x.gid)}"]`),undefined,true);else if(x.type==='graph_row_height')setRowHeight(x.row,x.height);else if(x.type==='graph_rename'){const el=document.querySelector(`.graph[data-gid="${CSS.escape(x.gid)}"]`);if(el)el.querySelector('header b').textContent=x.name}else if(x.type==='global')refreshOscStatus();else if(['add','delete','rename','graph_add','graph_delete'].includes(x.type))location.reload()}}catch{setInterval(()=>fetch('/api/state').then(r=>r.json()).then(updateState),1500)}
initGraphs();
</script></body></html>
